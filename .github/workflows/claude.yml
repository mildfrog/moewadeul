name: Claude

# 저장소 소유자가 자기 이슈에 claude 라벨을 붙이거나 @claude 댓글을 달면 Claude Code가 develop에서 브랜치를 만들어 구현하고 PR을 연다.
# 머지는 사람이 한다. 봇 PR은 develop 룰셋이 승인 1명을 요구하고, 결정적 검사(ci.yml)가 통과해야 한다.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # 공개 저장소라 남이 쓴 이슈 본문과 댓글은 프롬프트 주입 통로가 된다. 실행한 사람과 이슈 작성자가 모두 소유자일 때만 돈다.
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.pull_request == null &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          trigger_phrase: '@claude'
          base_branch: develop
          branch_prefix: claude/
          # 허용 목록 밖의 명령은 거절된다. 빌드·테스트·git·PR 생성만 연다.
          claude_args: |
            --permission-mode acceptEdits
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(cd:*),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh issue view:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "CLAUDE.md의 규칙을 따른다. 구현 전에 이슈의 완료 조건을 테스트로 옮기고, backend는 ./gradlew test spotlessCheck, frontend는 npm run build && npm run lint && npm test가 통과한 뒤 develop으로 PR을 연다. PR 본문은 .github/pull_request_template.md를 채우고 Closes #이슈번호를 넣는다. 테스트하지 못한 것은 확인하지 않은 것에 적는다."
