name: AI security review

# PR 변경분을 Claude가 보안 관점으로 읽고 PR에 댓글을 단다. 필수 검사로 걸지 않는다.
# LLM 리뷰는 오탐과 누락이 있어서 머지를 막는 일은 결정적 검사(secret-scan, 권한 표 테스트, ArchUnit)가 맡는다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크 PR과 Dependabot PR에는 시크릿이 없다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR의 변경분만 보안 관점으로 검토한다. 먼저 CLAUDE.md를 읽는다. 이 저장소에서 특히 볼 것은 다음과 같다.
            - 새 API 경로가 backend/src/test/java/com/moewadeul/common/security/AuthorizationMatrix.java에 알맞은 등급으로 들어갔는지
            - 인증·권한 검사 누락, 다른 회원의 자원에 접근하는 경로(IDOR)
            - SQL·MyBatis 매퍼의 문자열 치환(${})과 입력 검증
            - 비밀값과 개인정보(연계정보, 이메일, 전화번호)가 코드·로그·응답에 드러나는지
            - 외부 API 호출의 타임아웃과 재시도 한도
            확신이 낮은 지적, 스타일, 성능 이야기는 쓰지 않는다. 문제가 없으면 없다고 한 줄만 쓴다.
            결과는 gh pr comment로 댓글 하나에 한국어로 남긴다. 지적마다 파일:줄, 실패 시나리오, 고칠 방향을 적는다.
          claude_args: |
            --permission-mode default
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
