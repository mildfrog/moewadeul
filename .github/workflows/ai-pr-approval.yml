name: AI PR approval

# Claude가 연 PR은 저장소 소유자가 지금 머리 커밋을 승인해야 통과한다. 사람이 연 PR은 바로 통과한다.
# develop 브랜치 보호의 필수 검사라서, 승인 전에는 봇 PR을 머지할 수 없다. 커밋이 더해지면 다시 승인해야 한다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  ai-pr-approval:
    name: ai-pr-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 봇 PR이면 소유자의 승인 확인
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$AUTHOR" != "claude[bot]" && "$HEAD_REF" != claude/* ]]; then
            echo "사람이 연 PR이다. 통과"
            exit 0
          fi
          state="$(gh api "repos/${GH_REPO}/pulls/${PR}/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"${OWNER}\" and .commit_id == \"${HEAD_SHA}\")] | last | .state // \"NONE\"")"
          if [[ "$state" == "APPROVED" ]]; then
            echo "소유자가 ${HEAD_SHA}를 승인했다. 통과"
          else
            echo "::error::Claude가 연 PR이다. 소유자가 머리 커밋 ${HEAD_SHA}를 승인해야 머지할 수 있다(지금 상태: ${state})"
            exit 1
          fi
