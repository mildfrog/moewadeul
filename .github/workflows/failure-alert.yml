name: Failure alert

# develop·main의 CI나 배포가 실패하면 incident 라벨 이슈를 열고 디스코드로 알린다. 같은 워크플로의 열린 이슈가 있으면 새로 만들지 않고 댓글을 단다.
# 이 이슈의 작성자는 github-actions[bot]이라 AI 하네스(tools/ai-harness)가 받지 않는다. 고칠 일은 소유자가 새 이슈로 정리해 claude 라벨을 붙인다.
on:
  workflow_run:
    workflows: [CI, Deploy]
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      workflow:
        description: 시험용 워크플로 이름. 실제 실패 없이 이슈 생성과 중복 댓글을 확인한다
        default: alert-drill

permissions:
  contents: read

concurrency:
  group: failure-alert
  cancel-in-progress: false

jobs:
  open-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: incident 이슈 열기 또는 댓글 달기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          gh label create incident --color B60205 --description "CI·배포 실패 자동 감지" 2>/dev/null || true
          title="[incident] ${WORKFLOW} 실패 (${BRANCH})"
          body="$(printf '%s\n\n- 워크플로: %s\n- 브랜치: %s\n- 커밋: %s\n- 실행: %s\n' \
            "${WORKFLOW} 워크플로가 실패했다." "$WORKFLOW" "$BRANCH" "$SHA" "$RUN_URL")"
          existing="$(gh issue list --label incident --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
            issue_url="$(gh issue view "$existing" --json url --jq .url)"
          else
            issue_url="$(gh issue create --title "$title" --label incident --body "$body")"
          fi
          echo "ISSUE_URL=${issue_url}" >> "$GITHUB_ENV"

      - name: 디스코드 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW: ${{ github.event.workflow_run.name || inputs.workflow }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL이 없어 디스코드 알림을 건너뛴다"
            exit 0
          fi
          jq -n --arg content "🚨 ${WORKFLOW} 실패 (${BRANCH})"$'\n'"${ISSUE_URL}" '{content: $content}' \
            | curl -sS --fail-with-body -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
